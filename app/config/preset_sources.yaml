sources:
  - name: 国家数据局政策发布
    description: 国家数据主管部门政策原文；权威且链接稳定，限制是栏目包含非 AI 数据政策，交由来源关键词和准入规则收窄。
    source_type: html_list
    start_url: https://www.nda.gov.cn/sjj/zwgk/zcfb/list/index_pc_1.html
    collector_name: html_list
    default_category: policy_industry
    source_kind: formal
    source_tier: government
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [policy_industry]
    include_terms: [人工智能, 大模型, 智能体, 生成式]
    exclude_terms: [招聘, 培训班, 活动回顾]
    minimum_quality_score: 60
    accept_title_only: true
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      allowed_domains: [www.nda.gov.cn]
      discovery: {mode: selectors, max_pages: 1, max_depth: 0, max_items: 100}
      extraction:
        item_selector: .u-list > li
        title_selector: a
        link_selector: a
        date_selector: span

  - name: 国家网信办网信发布
    description: 国家网信办公开发布与生成式人工智能备案等权威通知；列表稳定，少量综合网信内容会被准入过滤。
    source_type: html_list
    start_url: https://www.cac.gov.cn/wxzw/wxfb/A093702index_1.htm
    collector_name: html_list
    default_category: policy_industry
    source_kind: formal
    source_tier: government
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [policy_industry]
    include_terms: [人工智能, 大模型, 算法, 智能体, 生成式]
    exclude_terms: [招聘, 培训班, 活动回顾]
    minimum_quality_score: 60
    accept_title_only: true
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      allowed_domains: [www.cac.gov.cn]
      discovery: {mode: selectors, max_pages: 1, max_depth: 0, max_items: 100}
      extraction:
        item_selector: "#loadingInfoPage > li"
        title_selector: h5 a
        link_selector: h5 a
        date_selector: .times

  - name: 百度智能云新闻
    description: 百度官方云与千帆动态，覆盖文心模型和智能体平台发布；详情链接稳定，但列表样式类名会变化，采用 URL 白名单抽取。
    source_type: html_list
    start_url: https://cloud.baidu.com/news/news
    collector_name: html_list
    default_category: model_technology
    source_kind: formal
    source_tier: official_company
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [model_technology, agent_product]
    include_terms: [人工智能, 大模型, 文心, 智能体, Agent, 千帆]
    exclude_terms: [招聘, 优惠, 活动回顾, 嘉宾]
    minimum_quality_score: 58
    accept_title_only: true
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      allowed_domains: [cloud.baidu.com]
      discovery:
        mode: link_filter
        max_pages: 1
        max_depth: 0
        max_items: 100
        include_url_patterns: [/news/news_]

  - name: 百度智能云客户案例
    description: 百度官方客户案例库，包含可核验的行业主体和业务成果；案例数量大且部分较旧，依靠更新时间和准入分数筛选。
    source_type: html_list
    start_url: https://cloud.baidu.com/case/index.html
    collector_name: html_list
    default_category: enterprise_case
    source_kind: formal
    source_tier: official_company
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [enterprise_case]
    include_terms: [人工智能, 大模型, 智能体, AI]
    exclude_terms: [招聘, 培训班, 优惠, 活动回顾]
    minimum_quality_score: 58
    accept_title_only: true
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      allowed_domains: [cloud.baidu.com]
      discovery:
        mode: link_filter
        max_pages: 1
        max_depth: 0
        max_items: 200
        include_url_patterns: [/customer/case/]

  - name: 中国互联网协会通知公告
    description: 国家级行业协会通知，稳定覆盖案例征集、申报与名单；栏目也含培训和会议内容，准入排除词为必要质量门槛。
    source_type: html_list
    start_url: https://www.isc.org.cn/category/7330.html
    collector_name: html_list
    default_category: solicitation
    source_kind: formal
    source_tier: association
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [solicitation, award_case, policy_industry]
    include_terms: [人工智能, 大模型, 智能体, AI]
    exclude_terms: [招聘, 培训班, 会员服务, 活动回顾, 会议日程]
    minimum_quality_score: 58
    accept_title_only: true
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      allowed_domains: [www.isc.org.cn]
      discovery: {mode: selectors, max_pages: 1, max_depth: 0, max_items: 100}
      extraction:
        item_selector: .news-list > li
        title_selector: h3
        link_selector: a
        date_selector: .msg span

  - name: AIIA 人工智能产业发展联盟
    description: 产业联盟官方动态，覆盖标准、征集与优秀案例；部分详情跳转外部官网或微信公众号，无法稳定访问正文时仅保留可信标题和公开跳转链接。
    source_type: html_list
    start_url: https://www.aiiaorg.cn/
    collector_name: html_list
    default_category: policy_industry
    source_kind: formal
    source_tier: association
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [solicitation, award_case, policy_industry]
    include_terms: [人工智能, 大模型, 智能体, 标准, 征集, 案例, 名单]
    exclude_terms: [招聘, 培训班, 会员服务, 活动回顾]
    minimum_quality_score: 58
    accept_title_only: true
    allow_external_links: true
    allow_technical_updates: false
    collector_config:
      allowed_domains: [www.aiiaorg.cn, aihub.caict.ac.cn, mp.weixin.qq.com]
      discovery: {mode: selectors, max_pages: 1, max_depth: 0, max_items: 100}
      extraction:
        item_selector: .news-scroll-area div.cursor-pointer
        title_selector: h3
        date_selector: span
        embedded_title_key: title
        embedded_link_key: external_url

  - name: OpenAI News RSS
    description: OpenAI 官方新闻 RSS，稳定提供模型、产品与智能体发布原文；英文内容为主，需以发布和重大更新信号通过准入。
    source_type: rss
    start_url: https://openai.com/news/rss.xml
    collector_name: rss
    default_category: model_technology
    source_kind: formal
    source_tier: official_company
    audience: leadership
    homepage_visible: true
    export_visible: true
    content_scope: [model_technology, agent_product, enterprise_case]
    include_terms: [OpenAI, GPT, model, agent, AI]
    exclude_terms: [hiring, careers, event recap, discount]
    minimum_quality_score: 58
    accept_title_only: false
    allow_external_links: false
    allow_technical_updates: false
    collector_config:
      max_items: 100
