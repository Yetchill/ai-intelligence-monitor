<nav class="pagination" aria-label="分页">
  <span>第 {{ page.page }} / {{ page.total_pages }} 页 · 共 {{ page.total }} 条</span>
  <div>
    {% if previous_url %}<a class="button small" href="{{ previous_url }}">上一页</a>{% else %}<span class="button small disabled">上一页</span>{% endif %}
    {% if next_url %}<a class="button small" href="{{ next_url }}">下一页</a>{% else %}<span class="button small disabled">下一页</span>{% endif %}
  </div>
</nav>
