<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 行业情报{% endblock %}</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
    <script src="{{ request.url_for('static', path='app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">AI 行业情报</a>
      <nav aria-label="主导航">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>资讯</a>
        <a href="/sources" {% if request.url.path.startswith('/sources') %}aria-current="page"{% endif %}>来源</a>
        <a href="/runs" {% if request.url.path == '/runs' %}aria-current="page"{% endif %}>更新记录</a>
        <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>设置</a>
      </nav>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
