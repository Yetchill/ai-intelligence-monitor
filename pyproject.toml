[project]
name = "ai-intelligence-monitor"
version = "0.1.0"
description = "Local AI industry intelligence monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["app/storage/migrations/versions"]
venvPath = "."
venv = ".venv"
